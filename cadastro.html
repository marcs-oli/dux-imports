<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Dux Imports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: white; border-radius: var(--radius-xl); padding: 2.5rem; max-width: 480px; width: 100%; box-shadow: var(--shadow-xl); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo .brand { font-size: 1.6rem; font-weight: 900; color: var(--primary); }
    .auth-logo .brand span { color: var(--gray-900); }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <a href="/" class="brand">Dux <span>Imports</span></a>
  </div>
  <h2 style="font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:.5rem">Criar Conta Grátis</h2>
  <p style="text-align:center;color:var(--gray-500);font-size:.88rem;margin-bottom:2rem">Junte-se a milhares de clientes satisfeitos</p>

  <div id="error-alert" class="alert alert-danger hidden"></div>

  <form id="register-form" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label class="form-label">Nome Completo *</label>
      <input type="text" class="form-control" id="name" placeholder="Seu nome completo" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">E-mail *</label>
      <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" maxlength="14">
      </div>
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" id="phone" placeholder="(00) 00000-0000">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Senha *</label>
      <div style="position:relative">
        <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required style="padding-right:2.5rem">
        <button type="button" onclick="togglePassword('password','eye1')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gray-400);cursor:pointer">
          <i class="fas fa-eye" id="eye1"></i>
        </button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar Senha *</label>
      <div style="position:relative">
        <input type="password" class="form-control" id="confirm-password" placeholder="Repita a senha" required style="padding-right:2.5rem">
        <button type="button" onclick="togglePassword('confirm-password','eye2')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gray-400);cursor:pointer">
          <i class="fas fa-eye" id="eye2"></i>
        </button>
      </div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:.6rem;margin-bottom:1.25rem;font-size:.82rem;color:var(--gray-600)">
      <input type="checkbox" id="terms" required style="margin-top:2px;accent-color:var(--primary)">
      <label for="terms">Concordo com os <a href="#" style="color:var(--primary)">Termos de Uso</a> e <a href="#" style="color:var(--primary)">Política de Privacidade</a></label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" id="register-btn">
      <i class="fas fa-user-plus"></i> Criar Conta
    </button>
  </form>

  <p style="text-align:center;font-size:.88rem;color:var(--gray-600);margin-top:1.5rem">
    Já tem conta?
    <a href="/login" style="color:var(--primary);font-weight:700">Fazer login</a>
  </p>
</div>

<script src="/js/app.js"></script>
<script>
  if (auth.isLoggedIn()) window.location.href = '/conta';

  function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  }

  async function handleRegister(e) {
    e.preventDefault();
    const errorAlert = document.getElementById('error-alert');
    errorAlert.classList.add('hidden');

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;

    if (password !== confirm) {
      errorAlert.innerHTML = '<i class="fas fa-exclamation-circle"></i> As senhas não coincidem';
      errorAlert.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner spinner-sm" style="border-color:rgba(255,255,255,.3);border-top-color:white;margin:0 auto"></div>';

    try {
      const data = await api.post('/auth/register', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password,
        cpf: document.getElementById('cpf').value,
        phone: document.getElementById('phone').value
      });
      auth.login(data.token, data.user);
      toast.success('Conta criada com sucesso!');
      setTimeout(() => window.location.href = '/conta', 500);
    } catch (err) {
      errorAlert.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${err.message}`;
      errorAlert.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta';
    }
  }
</script>
</body>
</html>
