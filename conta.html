<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta - Dux Imports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .account-layout { display: grid; grid-template-columns: 260px 1fr; gap: 2rem; align-items: start; }
    .account-sidebar { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); overflow: hidden; position: sticky; top: 90px; }
    .account-avatar { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 2rem; text-align: center; color: white; }
    .avatar-circle { width: 72px; height: 72px; background: rgba(255,255,255,.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; }
    .account-nav-item { display: flex; align-items: center; gap: .75rem; padding: .85rem 1.25rem; font-size: .88rem; color: var(--gray-600); cursor: pointer; transition: var(--transition); border-left: 3px solid transparent; }
    .account-nav-item:hover { background: var(--gray-50); color: var(--primary); }
    .account-nav-item.active { background: var(--primary-50); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
    .account-nav-item i { width: 18px; text-align: center; }
    @media (max-width: 768px) { .account-layout { grid-template-columns: 1fr; } .account-sidebar { position: static; } }
  </style>
</head>
<body>

<!-- ─── NAVBAR ─── -->
<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <span>Dux <em>Imports</em></span>
      </a>
      <div class="navbar-search">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="navbar-search" placeholder="Buscar produtos...">
        <div class="search-results-dropdown" id="search-dropdown"></div>
      </div>
      <div class="navbar-actions">
        <a href="/loja" class="nav-btn"><i class="fas fa-store"></i><span>Loja</span></a>
        <div id="nav-login-btn"><a href="/login" class="nav-btn"><i class="fas fa-user"></i><span>Entrar</span></a></div>
        <div id="nav-user-menu" class="hidden" style="position:relative;">
          <button class="nav-btn active" onclick="toggleUserDropdown()">
            <i class="fas fa-user-circle"></i><span id="nav-user-name">Usuário</span>
          </button>
          <div id="user-dropdown" style="display:none;position:absolute;top:calc(100% + 8px);right:0;background:white;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.12);min-width:180px;z-index:100;overflow:hidden;">
            <a href="/conta" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#334155"><i class="fas fa-user" style="color:#1a56db;width:16px"></i> Minha Conta</a>
            <a href="/pedidos" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#334155"><i class="fas fa-box" style="color:#1a56db;width:16px"></i> Meus Pedidos</a>
            <hr style="margin:0;border-color:#f1f5f9">
            <button id="nav-logout-btn" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#ef4444;width:100%;border:none;background:none;cursor:pointer"><i class="fas fa-sign-out-alt" style="width:16px"></i> Sair</button>
          </div>
        </div>
        <a href="/carrinho" class="nav-btn nav-btn-cart" style="position:relative">
          <i class="fas fa-shopping-cart"></i><span>Carrinho</span>
          <span class="cart-badge" id="cart-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- ─── CONTEÚDO ─── -->
<div class="container" style="padding-top:2rem;padding-bottom:4rem">
  <div class="breadcrumb">
    <a href="/">Início</a>
    <span class="breadcrumb-sep">/</span>
    <span>Minha Conta</span>
  </div>

  <div class="account-layout">
    <!-- ─── SIDEBAR ─── -->
    <aside class="account-sidebar">
      <div class="account-avatar">
        <div class="avatar-circle"><i class="fas fa-user"></i></div>
        <div style="font-weight:700;font-size:1rem" id="sidebar-name">Carregando...</div>
        <div style="font-size:.8rem;opacity:.8" id="sidebar-email"></div>
      </div>
      <nav>
        <div class="account-nav-item active" onclick="showTab('profile', this)">
          <i class="fas fa-user"></i> Meu Perfil
        </div>
        <a href="/pedidos" class="account-nav-item">
          <i class="fas fa-box"></i> Meus Pedidos
        </a>
        <a href="/carrinho" class="account-nav-item">
          <i class="fas fa-shopping-cart"></i> Carrinho
        </a>
        <div class="account-nav-item" onclick="auth.logout()" style="color:var(--danger)">
          <i class="fas fa-sign-out-alt"></i> Sair da Conta
        </div>
      </nav>
    </aside>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <main>
      <!-- Perfil -->
      <div id="tab-profile">
        <div class="card">
          <div class="card-header">
            <h3 style="font-size:1.05rem">Informações Pessoais</h3>
            <button class="btn btn-outline btn-sm" onclick="toggleEdit()"><i class="fas fa-edit"></i> Editar</button>
          </div>
          <div class="card-body">
            <div id="profile-view">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">Nome</div><div id="view-name" style="font-weight:600">-</div></div>
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">E-mail</div><div id="view-email" style="font-weight:600">-</div></div>
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">Telefone</div><div id="view-phone" style="font-weight:600">-</div></div>
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">CPF</div><div id="view-cpf" style="font-weight:600">-</div></div>
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">Endereço</div><div id="view-address" style="font-weight:600">-</div></div>
                <div><div class="text-xs text-muted fw-semibold" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem">Cidade/Estado</div><div id="view-city" style="font-weight:600">-</div></div>
              </div>
            </div>
            <form id="profile-form" class="hidden" onsubmit="saveProfile(event)">
              <div class="form-row">
                <div class="form-group"><label class="form-label">Nome</label><input type="text" class="form-control" id="edit-name"></div>
                <div class="form-group"><label class="form-label">Telefone</label><input type="text" class="form-control" id="edit-phone"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">CPF</label><input type="text" class="form-control" id="edit-cpf"></div>
                <div class="form-group"><label class="form-label">CEP</label><input type="text" class="form-control" id="edit-zip"></div>
              </div>
              <div class="form-group"><label class="form-label">Endereço</label><input type="text" class="form-control" id="edit-address"></div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">Cidade</label><input type="text" class="form-control" id="edit-city"></div>
                <div class="form-group"><label class="form-label">Estado</label><input type="text" class="form-control" id="edit-state" maxlength="2"></div>
              </div>
              <div style="display:flex;gap:.75rem">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                <button type="button" class="btn btn-outline" onclick="toggleEdit()">Cancelar</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Resumo de pedidos -->
        <div class="card" style="margin-top:1.5rem">
          <div class="card-header">
            <h3 style="font-size:1.05rem">Resumo de Pedidos</h3>
            <a href="/pedidos" class="btn btn-outline btn-sm">Ver todos</a>
          </div>
          <div class="card-body" id="recent-orders-summary">
            <div style="text-align:center;padding:2rem;color:var(--gray-400)">
              <div class="spinner" style="margin:0 auto 1rem"></div>
              Carregando pedidos...
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (!auth.isLoggedIn()) window.location.href = '/login?redirect=/conta';

  let userProfile = null;
  let editMode = false;

  function toggleUserDropdown() {
    const d = document.getElementById('user-dropdown');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('nav-user-menu');
    const dropdown = document.getElementById('user-dropdown');
    if (menu && dropdown && !menu.contains(e.target)) dropdown.style.display = 'none';
  });

  function showTab(tab, el) {
    document.querySelectorAll('.account-nav-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
  }

  function toggleEdit() {
    editMode = !editMode;
    document.getElementById('profile-view').classList.toggle('hidden', editMode);
    document.getElementById('profile-form').classList.toggle('hidden', !editMode);
    if (editMode && userProfile) {
      document.getElementById('edit-name').value = userProfile.name || '';
      document.getElementById('edit-phone').value = userProfile.phone || '';
      document.getElementById('edit-cpf').value = userProfile.cpf || '';
      document.getElementById('edit-address').value = userProfile.address || '';
      document.getElementById('edit-city').value = userProfile.city || '';
      document.getElementById('edit-state').value = userProfile.state || '';
      document.getElementById('edit-zip').value = userProfile.zip_code || '';
    }
  }

  async function saveProfile(e) {
    e.preventDefault();
    try {
      await api.put('/auth/profile', {
        name: document.getElementById('edit-name').value,
        phone: document.getElementById('edit-phone').value,
        cpf: document.getElementById('edit-cpf').value,
        address: document.getElementById('edit-address').value,
        city: document.getElementById('edit-city').value,
        state: document.getElementById('edit-state').value,
        zip_code: document.getElementById('edit-zip').value
      }, true);
      toast.success('Perfil atualizado!');
      await loadProfile();
      toggleEdit();
    } catch (err) {
      toast.error(err.message);
    }
  }

  async function loadProfile() {
    try {
      userProfile = await api.get('/auth/profile', true);
      document.getElementById('sidebar-name').textContent = userProfile.name;
      document.getElementById('sidebar-email').textContent = userProfile.email;
      document.getElementById('view-name').textContent = userProfile.name || '-';
      document.getElementById('view-email').textContent = userProfile.email || '-';
      document.getElementById('view-phone').textContent = userProfile.phone || 'Não informado';
      document.getElementById('view-cpf').textContent = userProfile.cpf || 'Não informado';
      document.getElementById('view-address').textContent = userProfile.address || 'Não informado';
      document.getElementById('view-city').textContent = userProfile.city && userProfile.state ? `${userProfile.city}/${userProfile.state}` : 'Não informado';
    } catch {}
  }

  async function loadRecentOrders() {
    const el = document.getElementById('recent-orders-summary');
    try {
      const orders = await api.get('/orders/my', true);
      if (orders.length === 0) {
        el.innerHTML = '<div class="empty-state" style="padding:2rem"><div class="empty-state-icon">📦</div><p>Nenhum pedido realizado ainda.</p><a href="/loja" class="btn btn-primary btn-sm">Ir às Compras</a></div>';
        return;
      }
      const statusColors = { pending: 'warning', paid: 'success', processing: 'info', shipped: 'primary', delivered: 'success', cancelled: 'danger' };
      el.innerHTML = orders.slice(0, 3).map(o => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:.85rem 0;border-bottom:1px solid var(--gray-100)">
          <div>
            <div style="font-weight:600;font-size:.9rem">${o.order_number}</div>
            <div style="font-size:.78rem;color:var(--gray-500)">${fmt.date(o.created_at)} • ${o.items?.length || 0} item(s)</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;color:var(--primary)">${fmt.currency(o.total)}</div>
            <span class="badge badge-${statusColors[o.status] || 'gray'}" style="font-size:.72rem">${fmt.statusLabel(o.status)}</span>
          </div>
        </div>`).join('') +
        (orders.length > 3 ? `<div style="text-align:center;padding-top:1rem"><a href="/pedidos" class="btn btn-outline btn-sm">Ver todos os ${orders.length} pedidos</a></div>` : '');
    } catch {
      el.innerHTML = '<p class="text-muted text-sm">Erro ao carregar pedidos.</p>';
    }
  }

  loadProfile();
  loadRecentOrders();
</script>
</body>
</html>
