<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos - Dux Imports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .order-card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); margin-bottom: 1.25rem; overflow: hidden; transition: var(--transition); }
    .order-card:hover { border-color: var(--primary-100); box-shadow: var(--shadow); }
    .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.5rem; background: var(--gray-50); border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; gap: .75rem; }
    .order-card-body { padding: 1.25rem 1.5rem; }
    .order-item-row { display: flex; align-items: center; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--gray-50); }
    .order-item-row:last-child { border-bottom: none; }
    .order-item-row img { width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-sm); background: var(--gray-100); flex-shrink: 0; }
    .status-timeline { display: flex; align-items: center; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    .timeline-step { display: flex; align-items: center; gap: .4rem; font-size: .75rem; color: var(--gray-400); }
    .timeline-step.done { color: var(--success); }
    .timeline-step.current { color: var(--primary); font-weight: 700; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .timeline-line { width: 24px; height: 1px; background: var(--gray-200); }
    .timeline-line.done { background: var(--success); }
  </style>
</head>
<body>

<!-- ─── NAVBAR ─── -->
<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <span>Dux <em>Imports</em></span>
      </a>
      <div class="navbar-search">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="navbar-search" placeholder="Buscar produtos...">
        <div class="search-results-dropdown" id="search-dropdown"></div>
      </div>
      <div class="navbar-actions">
        <a href="/loja" class="nav-btn"><i class="fas fa-store"></i><span>Loja</span></a>
        <div id="nav-login-btn"><a href="/login" class="nav-btn"><i class="fas fa-user"></i><span>Entrar</span></a></div>
        <div id="nav-user-menu" class="hidden" style="position:relative;">
          <button class="nav-btn" onclick="toggleUserDropdown()">
            <i class="fas fa-user-circle"></i><span id="nav-user-name">Usuário</span>
          </button>
          <div id="user-dropdown" style="display:none;position:absolute;top:calc(100% + 8px);right:0;background:white;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.12);min-width:180px;z-index:100;overflow:hidden;">
            <a href="/conta" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#334155"><i class="fas fa-user" style="color:#1a56db;width:16px"></i> Minha Conta</a>
            <a href="/pedidos" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#334155"><i class="fas fa-box" style="color:#1a56db;width:16px"></i> Meus Pedidos</a>
            <hr style="margin:0;border-color:#f1f5f9">
            <button id="nav-logout-btn" style="display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;font-size:.85rem;color:#ef4444;width:100%;border:none;background:none;cursor:pointer"><i class="fas fa-sign-out-alt" style="width:16px"></i> Sair</button>
          </div>
        </div>
        <a href="/carrinho" class="nav-btn nav-btn-cart" style="position:relative">
          <i class="fas fa-shopping-cart"></i><span>Carrinho</span>
          <span class="cart-badge" id="cart-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- ─── CONTEÚDO ─── -->
<div class="container" style="padding-top:2rem;padding-bottom:4rem">
  <div class="breadcrumb">
    <a href="/">Início</a>
    <span class="breadcrumb-sep">/</span>
    <a href="/conta">Minha Conta</a>
    <span class="breadcrumb-sep">/</span>
    <span>Meus Pedidos</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem">
    <h1 style="font-size:1.75rem"><i class="fas fa-box" style="color:var(--primary)"></i> Meus Pedidos</h1>
    <a href="/loja" class="btn btn-outline"><i class="fas fa-plus"></i> Nova Compra</a>
  </div>

  <!-- Filtros de status -->
  <div class="tabs" style="margin-bottom:1.5rem">
    <button class="tab-btn active" onclick="filterOrders('', this)">Todos</button>
    <button class="tab-btn" onclick="filterOrders('pending', this)">Aguardando</button>
    <button class="tab-btn" onclick="filterOrders('paid', this)">Pagos</button>
    <button class="tab-btn" onclick="filterOrders('shipped', this)">Enviados</button>
    <button class="tab-btn" onclick="filterOrders('delivered', this)">Entregues</button>
    <button class="tab-btn" onclick="filterOrders('cancelled', this)">Cancelados</button>
  </div>

  <div id="orders-loading" style="text-align:center;padding:3rem">
    <div class="spinner" style="margin:0 auto"></div>
    <p class="text-muted" style="margin-top:1rem">Carregando pedidos...</p>
  </div>

  <div id="orders-list" class="hidden"></div>
  <div id="orders-empty" class="hidden">
    <div class="empty-state">
      <div class="empty-state-icon">📦</div>
      <h3>Nenhum pedido encontrado</h3>
      <p>Você ainda não realizou nenhum pedido.</p>
      <a href="/loja" class="btn btn-primary">Ir às Compras</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (!auth.isLoggedIn()) window.location.href = '/login?redirect=/pedidos';

  let allOrders = [];
  let currentFilter = '';

  function toggleUserDropdown() {
    const d = document.getElementById('user-dropdown');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('nav-user-menu');
    const dropdown = document.getElementById('user-dropdown');
    if (menu && dropdown && !menu.contains(e.target)) dropdown.style.display = 'none';
  });

  function filterOrders(status, btn) {
    currentFilter = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOrders();
  }

  const statusSteps = ['pending', 'paid', 'processing', 'shipped', 'delivered'];
  const statusIcons = { pending: '⏳', paid: '✅', processing: '⚙️', shipped: '🚚', delivered: '🎉', cancelled: '❌' };

  function getStatusTimeline(currentStatus) {
    if (currentStatus === 'cancelled') return '<span style="color:var(--danger);font-size:.8rem">❌ Pedido cancelado</span>';
    return statusSteps.map((s, i) => {
      const idx = statusSteps.indexOf(currentStatus);
      const isDone = i < idx;
      const isCurrent = i === idx;
      const labels = { pending: 'Aguardando', paid: 'Pago', processing: 'Processando', shipped: 'Enviado', delivered: 'Entregue' };
      return `
        ${i > 0 ? `<div class="timeline-line ${isDone || isCurrent ? 'done' : ''}"></div>` : ''}
        <div class="timeline-step ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
          <div class="timeline-dot"></div>
          <span>${labels[s]}</span>
        </div>`;
    }).join('');
  }

  function renderOrders() {
    const filtered = currentFilter ? allOrders.filter(o => o.status === currentFilter) : allOrders;
    const list = document.getElementById('orders-list');
    const empty = document.getElementById('orders-empty');

    if (filtered.length === 0) {
      list.classList.add('hidden');
      empty.classList.remove('hidden');
      return;
    }

    empty.classList.add('hidden');
    list.classList.remove('hidden');

    const statusColors = { pending: 'warning', paid: 'success', processing: 'info', shipped: 'primary', delivered: 'success', cancelled: 'danger' };
    const paymentLabels = { pix: 'PIX', credit_card: 'Cartão', boleto: 'Boleto' };

    list.innerHTML = filtered.map(o => `
      <div class="order-card">
        <div class="order-card-header">
          <div>
            <div style="font-weight:700;font-size:.95rem">${o.order_number}</div>
            <div style="font-size:.78rem;color:var(--gray-500)">${fmt.datetime(o.created_at)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
            <span class="badge badge-${statusColors[o.status] || 'gray'}">${fmt.statusLabel(o.status)}</span>
            <span style="font-weight:800;color:var(--primary);font-size:1rem">${fmt.currency(o.total)}</span>
          </div>
        </div>
        <div class="order-card-body">
          ${(o.items || []).map(item => `
            <div class="order-item-row">
              <img src="${item.image_url || 'https://via.placeholder.com/48'}" alt="${item.product_name}" onerror="this.src='https://via.placeholder.com/48'">
              <div style="flex:1;min-width:0">
                <div style="font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.product_name}</div>
                <div style="font-size:.78rem;color:var(--gray-500)">Qtd: ${item.quantity} × ${fmt.currency(item.product_price)}</div>
              </div>
              <div style="font-size:.88rem;font-weight:700">${fmt.currency(item.subtotal)}</div>
            </div>`).join('')}

          <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem">
            <div>
              <div style="font-size:.78rem;color:var(--gray-500)">Pagamento: <strong>${paymentLabels[o.payment_method] || o.payment_method || '-'}</strong></div>
              <div style="font-size:.78rem;color:var(--gray-500)">Frete: <strong>${o.shipping === 0 ? 'Grátis' : fmt.currency(o.shipping)}</strong></div>
            </div>
            <div style="display:flex;gap:.5rem">
              <button class="btn btn-outline btn-sm" onclick="toggleTimeline(${o.id})">
                <i class="fas fa-map-marker-alt"></i> Rastrear
              </button>
            </div>
          </div>

          <div id="timeline-${o.id}" class="hidden" style="margin-top:1rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius)">
            <div style="font-size:.8rem;font-weight:700;color:var(--gray-600);margin-bottom:.5rem">STATUS DO PEDIDO</div>
            <div class="status-timeline">${getStatusTimeline(o.status)}</div>
          </div>
        </div>
      </div>`).join('');
  }

  function toggleTimeline(id) {
    const el = document.getElementById(`timeline-${id}`);
    el.classList.toggle('hidden');
  }

  async function loadOrders() {
    try {
      allOrders = await api.get('/orders/my', true);
      document.getElementById('orders-loading').classList.add('hidden');
      renderOrders();
    } catch (e) {
      document.getElementById('orders-loading').innerHTML = '<p class="text-muted">Erro ao carregar pedidos.</p>';
    }
  }

  loadOrders();
</script>
</body>
</html>
